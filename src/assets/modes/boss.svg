<svg xmlns="http://www.w3.org/2000/svg" width="680" height="260" viewBox="0 0 680 260">
  <!-- Boss Fight: the horned boss slams a lane, the player steps out of it. -->
  <defs>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5a6e" stop-opacity="0.5"/><stop offset="1" stop-color="#ff5a6e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="strike" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a6e" stop-opacity="0.05"/><stop offset="1" stop-color="#ff5a6e" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="g" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path d="M60 238 H620" stroke="#4fdcef" stroke-opacity="0.35" stroke-width="2"/>
  <path d="M250 40 V238 M370 40 V238" stroke="#9b85ff" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="6 8"/>
  <!-- The struck lane -->
  <rect x="250" y="40" width="120" height="198" fill="url(#strike)"/>
  <path d="M310 52 L296 120 L320 128 L302 214" fill="none" stroke="#ffd0d6" stroke-width="4" stroke-linejoin="round" filter="url(#g)"/>
  <!-- The boss -->
  <circle cx="530" cy="110" r="96" fill="url(#aura)"/>
  <g filter="url(#g)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M478 72 L456 26 M582 72 L604 26" stroke="#ff8f9d" stroke-width="7"/>
    <path d="M470 98 a60 56 0 0 1 120 0 v40 a30 30 0 0 1 -30 30 h-60 a30 30 0 0 1 -30 -30 z" fill="#1a0f22" stroke="#ff5a6e" stroke-width="5"/>
    <path d="M494 106 L520 118 M566 106 L540 118" stroke="#ffd0d6" stroke-width="7"/>
    <path d="M505 148 h50" stroke="#ff5a6e" stroke-width="5"/>
    <path d="M517 148 v10 M530 148 v10 M543 148 v10" stroke="#ff5a6e" stroke-width="3"/>
  </g>
  <!-- HP -->
  <g>
    <rect x="474" y="196" width="18" height="10" rx="2" fill="#ff5a6e"/>
    <rect x="497" y="196" width="18" height="10" rx="2" fill="#ff5a6e"/>
    <rect x="520" y="196" width="18" height="10" rx="2" fill="#ff5a6e"/>
    <rect x="543" y="196" width="18" height="10" rx="2" fill="none" stroke="#ff5a6e" stroke-opacity="0.6" stroke-width="2"/>
    <rect x="566" y="196" width="18" height="10" rx="2" fill="none" stroke="#ff5a6e" stroke-opacity="0.6" stroke-width="2"/>
  </g>
  <!-- The player steps out of the lane -->
  <g stroke="#f4f1ec" stroke-opacity="0.4" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 7">
    <path d="M232 150 H196"/><path d="M236 176 H188"/>
  </g>
  <g transform="translate(150 196)" fill="none" stroke="#0c0d16" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M0 -40 L4 0 M0 -40 L-24 -22 M0 -40 L26 -30 M4 0 L-18 42 M4 0 L28 40" stroke-width="14"/>
    <circle cx="-2" cy="-64" r="15" stroke-width="12"/>
  </g>
  <g filter="url(#g)">
    <g transform="translate(150 196)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 0 L-18 42 M4 0 L28 40" stroke="#4fdcef" stroke-width="7"/>
      <path d="M0 -40 L4 0" stroke="#f4f1ec" stroke-width="7"/>
      <path d="M0 -40 L-24 -22 M0 -40 L26 -30" stroke="#bff6ff" stroke-width="6"/>
      <circle cx="-2" cy="-64" r="15" fill="#bff6ff" fill-opacity="0.2" stroke="#f4f1ec" stroke-width="5"/>
    </g>
  </g>
</svg>
