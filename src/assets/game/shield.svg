<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Shield power-up: absorbs one miss. -->
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ff5cf"/>
      <stop offset="1" stop-color="#2fbf86"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path d="M64 10 L110.8 37 L110.8 91 L64 118 L17.2 91 L17.2 37 Z" fill="#5ee8a8" fill-opacity="0.16" stroke="#5ee8a8" stroke-width="6" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M64 32 L88 41 V63 C88 80 77 91 64 98 C51 91 40 80 40 63 V41 Z" fill="url(#fill)" stroke="#e6fff3" stroke-width="3" stroke-linejoin="round"/>
  <path d="M52 64 L61 73 L77 55" fill="none" stroke="#0c0d16" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M48 44 L62 39" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
</svg>
