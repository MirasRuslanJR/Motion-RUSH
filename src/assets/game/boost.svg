<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Boost power-up: double points for 8 seconds. -->
  <defs>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6dc"/>
      <stop offset="1" stop-color="#ffc76b"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffc76b" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffc76b" stop-opacity="0.08"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="64" cy="64" r="50" fill="url(#disc)" stroke="#ffc76b" stroke-width="6" filter="url(#glow)"/>
  <circle cx="64" cy="64" r="40" fill="none" stroke="#ffb48c" stroke-width="2" stroke-dasharray="6 7" opacity="0.7"/>
  <path d="M72 20 L38 72 L60 72 L52 108 L90 52 L67 52 Z" fill="url(#bolt)" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
