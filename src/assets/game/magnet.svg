<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Magnet power-up: every energy orb flies to the runner, whatever the lane. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9ad9"/>
      <stop offset="1" stop-color="#ff4f9a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path d="M34 90 V62 A30 30 0 0 1 94 62 V90" fill="none" stroke="url(#body)" stroke-width="22" filter="url(#glow)"/>
  <path d="M27 62 A37 37 0 0 1 101 62" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="3"/>
  <rect x="23" y="86" width="22" height="18" rx="3" fill="#e8fbff"/>
  <rect x="83" y="86" width="22" height="18" rx="3" fill="#e8fbff"/>
  <g fill="none" stroke="#4fdcef" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)">
    <path d="M26 112 Q34 121 42 112"/>
    <path d="M86 112 Q94 121 102 112"/>
    <path d="M48 116 Q64 128 80 116" stroke-opacity="0.7"/>
  </g>
</svg>
