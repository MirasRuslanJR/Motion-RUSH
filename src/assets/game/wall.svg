<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400" viewBox="0 0 300 400">
  <!-- Force-field wall that blocks a lane. Drawn stretched over the blocked lane. -->
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b85ff" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#5b3fd6" stop-opacity="0.36"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.5" cy="0.18" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="300" height="14" patternUnits="userSpaceOnUse">
      <rect width="300" height="2" fill="#ffffff" opacity="0.14"/>
    </pattern>
    <pattern id="hazard" width="56" height="56" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="28" height="56" fill="#ffb48c"/>
    </pattern>
    <clipPath id="inner"><rect x="22" y="22" width="256" height="356" rx="16"/></clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="22" y="22" width="256" height="356" rx="16" fill="url(#field)"/>
  <g clip-path="url(#inner)">
    <rect width="300" height="400" fill="url(#scan)"/>
    <rect width="300" height="400" fill="url(#shine)"/>
    <rect y="166" width="300" height="68" fill="url(#hazard)" opacity="0.9"/>
    <path d="M0 166 H300 M0 234 H300" stroke="#ffb48c" stroke-width="4"/>
  </g>
  <rect x="22" y="22" width="256" height="356" rx="16" fill="none" stroke="#9b85ff" stroke-width="10" filter="url(#glow)"/>
  <rect x="22" y="22" width="256" height="356" rx="16" fill="none" stroke="#ece6ff" stroke-width="2.5" opacity="0.85"/>
  <path d="M60 46 H240" stroke="#4fdcef" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <g fill="#4fdcef" filter="url(#glow)">
    <circle cx="44" cy="44" r="6"/><circle cx="256" cy="44" r="6"/><circle cx="44" cy="356" r="6"/><circle cx="256" cy="356" r="6"/>
  </g>
</svg>
