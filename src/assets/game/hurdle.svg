<svg xmlns="http://www.w3.org/2000/svg" width="400" height="160" viewBox="0 0 400 160">
  <!-- Low hurdle, one per lane: jump over it. The bottom edge stands on the track. -->
  <defs>
    <pattern id="stripes" width="44" height="44" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="44" height="44" fill="#f4f1ec"/>
      <rect width="22" height="44" fill="#4fdcef"/>
    </pattern>
    <linearGradient id="post" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e2444"/>
      <stop offset="1" stop-color="#0f1226"/>
    </linearGradient>
    <clipPath id="bar"><rect x="18" y="26" width="364" height="46" rx="14"/></clipPath>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <rect x="52" y="64" width="18" height="86" rx="5" fill="url(#post)" stroke="#4fdcef" stroke-width="3"/>
    <rect x="330" y="64" width="18" height="86" rx="5" fill="url(#post)" stroke="#4fdcef" stroke-width="3"/>
    <rect x="34" y="146" width="54" height="10" rx="5" fill="#4fdcef"/>
    <rect x="312" y="146" width="54" height="10" rx="5" fill="#4fdcef"/>
  </g>
  <rect x="18" y="26" width="364" height="46" rx="14" fill="none" stroke="#4fdcef" stroke-width="10" opacity="0.6" filter="url(#glow)"/>
  <g clip-path="url(#bar)">
    <rect width="400" height="160" fill="url(#stripes)"/>
    <rect x="18" y="26" width="364" height="12" fill="#ffffff" opacity="0.35"/>
  </g>
  <rect x="18" y="26" width="364" height="46" rx="14" fill="none" stroke="#e8fbff" stroke-width="3"/>
</svg>
